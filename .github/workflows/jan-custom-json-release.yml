name: Jan Custom json - Release

# Builds Jan Custom json for Windows, macOS and Linux on GitHub-hosted runners
# (no signing secrets needed) and publishes the installers as a GitHub release.
#
# Trigger with a tag `custom-json-v<version>`, e.g. custom-json-v0.8.6-1, or run
# it by hand with a version. A version suffix must be numeric: the Windows
# installer packs it into its four-part file version.

on:
  push:
    tags: ['custom-json-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.8.6-1'
        required: true

permissions:
  contents: read

concurrency:
  group: custom-json-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${REF_NAME#custom-json-v}"
          else
            version="$INPUT_VERSION"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            echo "::error::'$version' is not <major>.<minor>.<patch>[-<number>]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=custom-json-v$version" >> "$GITHUB_OUTPUT"

  build-linux-x64:
    needs: version
    uses: ./.github/workflows/template-tauri-build-linux-x64-external.yml
    with:
      ref: ${{ github.ref }}
      new_version: ${{ needs.version.outputs.version }}
      channel: stable
      disable_updater: true

  build-windows-x64:
    needs: version
    uses: ./.github/workflows/template-tauri-build-windows-x64-external.yml
    with:
      ref: ${{ github.ref }}
      new_version: ${{ needs.version.outputs.version }}
      channel: stable
      disable_updater: true

  build-macos:
    needs: version
    uses: ./.github/workflows/template-tauri-build-macos-external.yml
    with:
      ref: ${{ github.ref }}
      new_version: ${{ needs.version.outputs.version }}
      channel: stable
      disable_updater: true

  # Publishes whatever built, so one failing platform does not hold back the
  # others; re-running its failed job re-runs this one and adds the file.
  release:
    needs: [version, build-linux-x64, build-windows-x64, build-macos]
    if: >-
      !cancelled()
      && needs.version.result == 'success'
      && (needs.build-linux-x64.result == 'success'
        || needs.build-windows-x64.result == 'success'
        || needs.build-macos.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Getting the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.ref }}

      - name: Download installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: List installers
        run: ls -la dist

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Jan Custom json ${{ needs.version.outputs.version }}
          body_path: .github/custom-json-release-notes.md
          files: dist/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
